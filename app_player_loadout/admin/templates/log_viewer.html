<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Loadout de itens do jogador</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body { background: #f8f9fa; }
        #log-box {
            background-color: #1e1e1e;
            color: white;
            padding: 1rem;
            border-radius: 8px;
            height: 500px;
            overflow-y: scroll;
            font-family: monospace;
            white-space: pre-wrap;
        }
        .debug { color: #9cdcfe; }
        .info { color: #b5cea8; }
        .error { color: #f44747; }
    </style>
</head>
<body>
    <div class="container-fluid p-0">
        <nav class="navbar navbar-expand-lg navbar-light bg-primary shadow-sm">
            <a class="navbar-brand text-white" href="#"></a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNavDropdown"
                aria-controls="navbarNavDropdown" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNavDropdown">
                <ul class="navbar-nav ms-auto">
                    {% if session['is_admin'] %}
                    <li class="nav-item">
                        <a class="nav-link text-white" href="/">Armas</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link text-white" href="/general_items">Items gerais</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link text-white" href="/loadout_rules">Regras</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link text-white" href="/log_viewer">logs</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link text-white" href="/loadout_players">Players Loadout</a>
                    </li>                    
                    {% endif %}
                    
                </ul>
            </div>
        </nav>
    </div>
<div class="container mt-5">
    <h3 class="mb-3">Logs em Tempo Real</h3>
    <!-- Filtros -->
    <div class="mb-3">
        <label class="me-3"><input type="checkbox" class="form-check-input" id="filter-debug" checked> DEBUG</label>
        <label class="me-3"><input type="checkbox" class="form-check-input" id="filter-info" checked> INFO</label>
        <label class="me-3"><input type="checkbox" class="form-check-input" id="filter-error" checked> ERROR</label>
    </div>
    <div id="log-box"></div>
</div>

<script>
    const logBox = document.getElementById('log-box');

    const filters = {
        debug: document.getElementById('filter-debug'),
        info: document.getElementById('filter-info'),
        error: document.getElementById('filter-error')
    };

    function formatLine(line) {
        let span = document.createElement('div');

        if (line.includes('[DEBUG]')) {
            span.className = 'debug';
            span.dataset.level = 'debug';
        } else if (line.includes('[INFO]')) {
            span.className = 'info';
            span.dataset.level = 'info';
        } else if (line.includes('[ERROR]')) {
            span.className = 'error';
            span.dataset.level = 'error';
        }

        span.textContent = line;
        return span;
    }

    function isVisible(level) {
        return filters[level]?.checked;
    }

    function applyVisibility() {
        document.querySelectorAll('#log-box div').forEach(div => {
            const level = div.dataset.level;
            div.style.display = isVisible(level) ? 'block' : 'none';
        });
    }

    Object.values(filters).forEach(cb => cb.addEventListener('change', applyVisibility));

    // Autoscroll logic
    let autoScrollEnabled = true;

    logBox.addEventListener('scroll', () => {
        const nearBottom = logBox.scrollHeight - logBox.scrollTop - logBox.clientHeight < 50;
        autoScrollEnabled = nearBottom;
    });

    function appendLogLine(line) {
        const lineDiv = formatLine(line);
        if (!isVisible(lineDiv.dataset.level)) lineDiv.style.display = 'none';
        logBox.appendChild(lineDiv);
        if (autoScrollEnabled) {
            logBox.scrollTop = logBox.scrollHeight;
        }
    }

    // Carrega últimas 50 linhas
    fetch('/logs/latest')
        .then(response => response.json())
        .then(lines => {
            lines.forEach(line => appendLogLine(line));
        });

    // Streaming em tempo real
    const eventSource = new EventSource('/logs');
    eventSource.onmessage = function(event) {
        appendLogLine(event.data);
    };
</script>


</body>
</html>
