<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Loadout de itens do jogador</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body { background: #f8f9fa; }
        #log-box {
            background-color: #1e1e1e;
            color: white;
            padding: 1rem;
            border-radius: 8px;
            height: 500px;
            overflow-y: scroll;
            font-family: monospace;
            white-space: pre-wrap;
        }
        .debug { color: #9cdcfe; }
        .info { color: #b5cea8; }
        .error { color: #f44747; }
    </style>
</head>
<body>
    <div class="container-fluid p-0">
        <nav class="navbar navbar-expand-lg navbar-light bg-primary shadow-sm">
            <a class="navbar-brand text-white" href="#"></a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNavDropdown"
                aria-controls="navbarNavDropdown" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNavDropdown">
                <ul class="navbar-nav ms-auto">
                    {% if session['is_admin'] %}
                    <li class="nav-item">
                        <a class="nav-link text-white" href="/">Armas</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link text-white" href="/general_items">Items gerais</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link text-white" href="/loadout_rules">Regras</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link text-white" href="/log_viewer">logs</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link text-white" href="/player_loadouts">Meu Loadout</a>
                    </li>                    
                    {% endif %}
                    
                </ul>
            </div>
        </nav>
    </div>
<div class="container mt-5">
    <h3 class="mb-3">Logs em Tempo Real</h3>
    <!-- Filtros -->
    <div class="mb-3">
        <label class="me-3"><input type="checkbox" class="form-check-input" id="filter-debug" checked> DEBUG</label>
        <label class="me-3"><input type="checkbox" class="form-check-input" id="filter-info" checked> INFO</label>
        <label class="me-3"><input type="checkbox" class="form-check-input" id="filter-error" checked> ERROR</label>
    </div>
    <div id="log-box"></div>
</div>

<div class="container mt-5">
    <h2 class="mb-4 text-center">IDs de Administradores</h2>

    <div class="card shadow-sm mb-4">
      <div class="card-header bg-primary text-white">Adicionar Novo ID</div>
      <div class="card-body">
        <form id="add-form" class="row g-2">
          <div class="col-10">
            <input type="text" id="new-id" class="form-control" placeholder="Cole aqui o ID de 44 caracteres" required>
          </div>
          <div class="col-2">
            <button type="submit" class="btn btn-success w-100">Adicionar</button>
          </div>
        </form>
        <div id="add-msg" class="mt-2"></div>
      </div>
    </div>

    <div class="card shadow-sm">
      <div class="card-header bg-secondary text-white">Lista de IDs</div>
      <div class="card-body">
        <ul class="list-group" id="id-list">
          <!-- IDs serão carregados aqui -->
        </ul>
      </div>
    </div>
  </div>

<script>
    const logBox = document.getElementById('log-box');

    const filters = {
        debug: document.getElementById('filter-debug'),
        info: document.getElementById('filter-info'),
        error: document.getElementById('filter-error')
    };

    function formatLine(line) {
        let span = document.createElement('div');

        if (line.includes('[DEBUG]')) {
            span.className = 'debug';
            span.dataset.level = 'debug';
        } else if (line.includes('[INFO]')) {
            span.className = 'info';
            span.dataset.level = 'info';
        } else if (line.includes('[ERROR]')) {
            span.className = 'error';
            span.dataset.level = 'error';
        }

        span.textContent = line;
        return span;
    }

    function isVisible(level) {
        return filters[level]?.checked;
    }

    function applyVisibility() {
        document.querySelectorAll('#log-box div').forEach(div => {
            const level = div.dataset.level;
            div.style.display = isVisible(level) ? 'block' : 'none';
        });
    }

    Object.values(filters).forEach(cb => cb.addEventListener('change', applyVisibility));

    // Autoscroll logic
    let autoScrollEnabled = true;

    logBox.addEventListener('scroll', () => {
        const nearBottom = logBox.scrollHeight - logBox.scrollTop - logBox.clientHeight < 50;
        autoScrollEnabled = nearBottom;
    });

    function appendLogLine(line) {
        const lineDiv = formatLine(line);
        if (!isVisible(lineDiv.dataset.level)) lineDiv.style.display = 'none';
        logBox.appendChild(lineDiv);
        if (autoScrollEnabled) {
            logBox.scrollTop = logBox.scrollHeight;
        }
    }

    // Carrega últimas 50 linhas
    fetch('/logs/latest')
        .then(response => response.json())
        .then(lines => {
            lines.forEach(line => appendLogLine(line));
        });

    // Streaming em tempo real
    const eventSource = new EventSource('/logs');
    eventSource.onmessage = function(event) {
        appendLogLine(event.data);
    };
</script>

<script>
    async function carregarIds() {
      const list = document.getElementById('id-list');
      list.innerHTML = '';
      const res = await fetch('/admin_ids');
      const data = await res.json();
      data.forEach(id => {
        const li = document.createElement('li');
        li.className = 'list-group-item d-flex justify-content-between align-items-center';
        li.textContent = id;

        const btn = document.createElement('button');
        btn.className = 'btn btn-danger btn-sm';
        btn.textContent = 'Remover';
        btn.onclick = async () => {
          const resp = await fetch('/admin_ids', {
            method: 'DELETE',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ id })
          });
          const result = await resp.json();
          carregarIds();
        };

        li.appendChild(btn);
        list.appendChild(li);
      });
    }

    document.getElementById('add-form').addEventListener('submit', async e => {
      e.preventDefault();
      const input = document.getElementById('new-id');
      const msg = document.getElementById('add-msg');
      const id = input.value.trim();

      const res = await fetch('/admin_ids', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ id })
      });

      const data = await res.json();
      msg.textContent = data.message || data.error;
      msg.className = `mt-2 alert ${data.message ? 'alert-success' : 'alert-danger'}`;
      if (data.message) input.value = '';
      carregarIds();
    });

    window.onload = carregarIds;
  </script>
  
</body>
</html>
